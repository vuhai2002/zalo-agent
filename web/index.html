<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zalo Agent</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Gắn class .dark TRƯỚC khi React render. Để việc này cho useEffect thì
      trang vẽ xong một khung sáng rồi mới tối lại - mắt thấy rõ cú nháy trắng
      mỗi lần tải. Script inline, chạy đồng bộ, cố ý đặt trước bundle.
    -->
    <script>
      (function () {
        try {
          var luu = localStorage.getItem("zalo-agent-theme");
          var toi = luu
            ? luu === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (toi) document.documentElement.classList.add("dark");
        } catch (e) {
          /* localStorage bị chặn (chế độ riêng tư): cứ để giao diện sáng */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
